<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATH Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 12l6 6 6-6M5 21h14"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  </defs>
</svg>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#/"><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18l6-7 4 4 6-9"/></svg></i>ATH Scanner</a>
    <nav class="main" id="nav" aria-label="Primary">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/run" data-nav="run">Latest run</a>
      <a href="#/report" data-nav="report">Report dashboard</a>
      <a href="#/cost" data-nav="cost">Cost center</a>
      <a href="#/config" data-nav="config">Master configuration</a>
    </nav>
    <span class="spacer"></span>
    <span class="stamp mono" id="stamp"></span>
    <div class="seg" role="group" aria-label="Theme" id="theme"><button data-t="light" aria-pressed="false">Light</button><button data-t="dark" aria-pressed="false">Dark</button></div>
    <button class="btn ghost menu-btn" id="menu" aria-label="Menu" aria-expanded="false"><svg><use href="#i-menu"/></svg></button>
  </div>
</header>

<div class="crumbs" id="crumbs"><div class="wrap">
  <button class="btn ghost" id="back" aria-label="Back to previous page"><svg><use href="#i-back"/></svg>Back</button>
  <a class="btn ghost" href="#/"><svg><use href="#i-home"/></svg>Home</a>
  <div class="trail" id="trail"></div>
</div></div>

<main><div class="wrap" id="app">
  <div class="loading" style="padding:40px;text-align:center">Loading...</div>
</div></main>

<script src="/static/app.js"></script>
<script>
(function(){
  const root=document.documentElement, box=document.getElementById("theme");
  const sys=()=>matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
  function apply(t){root.dataset.theme=t; box.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===t));}
  let saved=null; try{saved=localStorage.getItem("ath-theme");}catch(e){}
  apply(saved||sys());
  box.onclick=e=>{const b=e.target.closest("button"); if(!b) return; apply(b.dataset.t); try{localStorage.setItem("ath-theme",b.dataset.t);}catch(e){}};
})();

document.getElementById("menu").onclick=()=>{const o=document.getElementById("nav").classList.toggle("open");document.getElementById("menu").setAttribute("aria-expanded",o)};
document.getElementById("back").onclick=()=>{ if(history.length>1) history.back(); else location.hash="#/"; };
</script>
</body>
</html>
