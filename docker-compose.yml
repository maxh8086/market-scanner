# One image per component. Everything here is a one-shot job except `laya`:
#   docker compose run --rm scanner --symbols INFY,TCS
# start.ps1 drives the whole sequence; stop.ps1 tears it down.
# `ui`, `collector` and `server` (Fastify API) are the long-running services; everything else is a one-shot job.
#
# The databases (Postgres, MongoDB, Neo4j) are this project's own services (scanner-postgres,
# scanner-mongo, scanner-neo4j) on the project's `market-scanner` network. The LLM server is
# NOT started by this project: it is an OpenAI-compatible endpoint given by URL (start.ps1 passes
# LOCAL_LLM_URL to enrich and conclude (llm-client). Nothing here depends on another compose project.
#
# Components hand off through the bind-mounted data/, output/ and logs/ folders
# (SQLite caches, TinyDB store, CSV/XLSX outputs).
#
# Secrets reach containers ONLY at runtime, through `env_file` (compose reads the
# file; no image, build arg or log ever contains it). The single secrets file is .env
# (Upstox/Kite and this project's database logins); a service gets it only if it needs it.
x-persist: &persist
  - ./data:/app/data
  - ./output:/app/output
  - ./logs:/app/logs

# Container-side database hosts. Inside a container 127.0.0.1 is the container itself, so each
# host is this project's service name on the project network. Logins still come from .env.
# Host scripts read SCANNER_MONGO_HOST and POSTGRES_* from .env (127.0.0.1 and the published ports).
x-scanner-db-env: &scanner-db-env
  SCANNER_MONGO_HOST: scanner-mongo:27017
  POSTGRES_HOST: scanner-postgres
  POSTGRES_PORT: "5432"
  NEO4J_URI: bolt://scanner-neo4j:7687

services:
  scanner:
    build: {context: ., dockerfile: docker/scanner/Dockerfile}
    env_file:
      - .env
    environment:
      <<: *scanner-db-env
      RUN_ID: ${RUN_ID:-}
      # Container path of the loader password file; loader_dsn() in scanner/company_reference_job.py reads it.
      POSTGRES_LOADER_PASSWORD_FILE: /run/secrets/company_reference_loader_password
      # Container path of the LLM chat token file (read-only mount below).
      LLM_CHAT_TOKEN_FILE: /run/service-tokens/llm_chat_token
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
      # Read-only single-file mount of the loader password file named in .env (git-ignored, never baked into the image).
      - ${POSTGRES_LOADER_PASSWORD_FILE:?set POSTGRES_LOADER_PASSWORD_FILE in .env to the host path of the loader password file}:/run/secrets/company_reference_loader_password:ro
      # Read-only single-file mount of the LLM chat token named in .env (APP_LLM_CHAT_TOKEN_FILE).
      - ${APP_LLM_CHAT_TOKEN_FILE:?set APP_LLM_CHAT_TOKEN_FILE in .env to the host path of the llm chat token file}:/run/service-tokens/llm_chat_token:ro
    networks:
      - default
      - llm
    restart: "no"

  enrich:
    image: ath-enrich
    build: {context: ., dockerfile: docker/enrich/Dockerfile}
    env_file:
      - .env
    environment:
      <<: *scanner-db-env
      RUN_ID: ${RUN_ID:-}
    volumes: &persist-config
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
      - ./config:/app/config:ro
    restart: "no"

  enrich-timesfm:        # enrich + TimesFM forecaster (torch, CPU)
    build: {context: ., dockerfile: docker/timesfm/Dockerfile}
    env_file:                            # database logins, for reading candles and filings
      - .env
    environment:
      <<: *scanner-db-env
      HF_HUB_OFFLINE: "1"                # weights are fetched once into ./data/huggingface, then read offline
      RUN_ID: ${RUN_ID:-}
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
      - ./data/huggingface:/home/appuser/.cache/huggingface   # TimesFM weights, project-owned
      - ./config:/app/config:ro
    restart: "no"

  crosscheck:            # independent of Upstox by design: no credentials
    build: {context: ., dockerfile: docker/crosscheck/Dockerfile}
    volumes: *persist
    restart: "no"

  portfolio:             # read-only Kite holdings overlay
    build: {context: ., dockerfile: docker/portfolio/Dockerfile}
    env_file: .env
    volumes: *persist
    restart: "no"



  graph:                 # loads the document store into neo4j, reads graph facts, purges expired data
    image: ath-enrich
    build: {context: ., dockerfile: docker/enrich/Dockerfile}
    entrypoint: ["python", "graph_sync.py"]
    env_file:                            # NEO4J_URI / NEO4J_AUTH from .env
      - .env
    environment:
      <<: *scanner-db-env
    volumes: *persist-config
    restart: "no"

  report:                # final workbook: every stock in sheet 1, summary in sheet 2
    image: ath-enrich
    build: {context: ., dockerfile: docker/enrich/Dockerfile}
    entrypoint: ["python", "final_report.py"]
    volumes: *persist
    restart: "no"

  conclude:              # per-stock conclusions from the stored insights; same image as enrich
    image: ath-enrich
    build: {context: ., dockerfile: docker/enrich/Dockerfile}
    entrypoint: ["python", "conclude.py"]
    env_file:                            # SCANNER_MONGO_* for conclusions, POSTGRES_* to record LLM calls (from .env)
      - .env
    environment:
      <<: *scanner-db-env
      LOCAL_LLM_URL: http://llm-client:8000
      RUN_ID: ${RUN_ID:-}
    networks: [default, llm]
    volumes: *persist
    restart: "no"

  collector:             # keeps candles, announcements, corporate actions, filings and fundamentals current
    image: ath-enrich                    # schedule and mode come from the UI (Master configuration)
    build: {context: ., dockerfile: docker/enrich/Dockerfile}
    entrypoint: ["python", "collect.py", "serve"]
    env_file:
      - .env
    environment:
      <<: *scanner-db-env
      MARKETDATA_BACKEND: postgres
      DOCSTORE_BACKEND: mongo
      POSTGRES_DSN: ${POSTGRES_DSN_CONTAINER}
      SECRETS_API_URL: http://ui:8080
      SERVICE_TOKEN_FILE: /run/app-keys/collector_token
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
      - ./config:/app/config:ro
      - ${APP_SERVICE_TOKEN_FILE:?set APP_SERVICE_TOKEN_FILE in .env to the host path of the collector token file}:/run/app-keys/collector_token:ro
    restart: always

  ui:                    # runs, cost metrics and stock dashboards on http://127.0.0.1:8080
    build: {context: ., dockerfile: docker/ui/Dockerfile}
    env_file:
      - .env
    environment:
      <<: *scanner-db-env
      APP_MASTER_KEY_FILE: /run/app-keys/app_master_key   # container path; the UI process holds the master key
      COLLECTOR_TOKEN_FILE: /run/service-tokens/collector_token
      LLM_CLIENT_TOKEN_FILE: /run/service-tokens/llm_client_token
      SERVER_TOKEN_FILE: /run/service-tokens/server_token
    volumes:
      - ./data:/app/data
      # Host folder that holds the master key (set APP_MASTER_KEY_DIR in .env). Read-only, never baked into the image.
      - ${APP_MASTER_KEY_DIR:?set APP_MASTER_KEY_DIR in .env to the folder that holds app_master_key}:/run/app-keys:ro
      # Single-file mount of the collector's service token, so the API can check the internal secrets endpoint.
      # Outside /run/app-keys so it is not nested inside the read-only key folder mount.
      - ${APP_SERVICE_TOKEN_FILE:?set APP_SERVICE_TOKEN_FILE in .env to the host path of the collector token file}:/run/service-tokens/collector_token:ro
      # Read-only single-file mount of the llm-client service token named in .env (APP_LLM_CLIENT_TOKEN_FILE).
      - ${APP_LLM_CLIENT_TOKEN_FILE:?set APP_LLM_CLIENT_TOKEN_FILE in .env to the host path of the llm-client service token file}:/run/service-tokens/llm_client_token:ro
      # Read-only single-file mount of the server service token named in .env (APP_SERVER_SECRETS_TOKEN_FILE).
      - ${APP_SERVER_SECRETS_TOKEN_FILE:?set APP_SERVER_SECRETS_TOKEN_FILE in .env to the host path of the server secrets token file}:/run/service-tokens/server_token:ro
    ports:
      - "127.0.0.1:8080:8080"            # loopback only: the UI has no login
    networks:
      - default
      - llm
    restart: always

  server:                # Fastify API: home-events ingest, /internal/* and /api/*; reached at http://server:8081
    build: {context: ., dockerfile: docker/server/Dockerfile}
    # No env_file and no ./data mount: database logins and tokens (ingest token, server secrets token) come from files under /run/app-keys, not .env or data/secrets.env.
    # Database login: dedicated role market_scanner_server (migration 057, created without a password; the user sets it out of band). Its password comes from the mounted file, read by server/src/config.ts.
    environment:
      <<: *scanner-db-env
      SERVER_HOST: 0.0.0.0                # listen on all container interfaces; the host publish below is loopback only
      SERVER_PORT: "8081"
      SERVICE_TOKEN_DIR: /run/app-keys    # server/src/index.ts reads <dir>/home_events_ingest_token
      POSTGRES_USER: market_scanner_server
      POSTGRES_DB: ${POSTGRES_DB:-market_scanner}
      POSTGRES_PASSWORD_FILE: /run/app-keys/server_db_password   # container path of the server role's password file
      SECRETS_TOKEN_FILE: /run/app-keys/server_secrets_token     # container path of the server's bearer token for the ui internal secrets endpoint
      SECRETS_API_URL: http://ui:8080                            # ui service on the project network (port 8080)
      BROKER_RETURN_URL: ${BROKER_RETURN_URL:-http://127.0.0.1:5173/}   # where the Kite callback sends the browser after login; open the app at 127.0.0.1, not localhost
    volumes:
      # Read-only single-file mount of the home-events ingest token. Do NOT mount the folder that holds app_master_key: only `ui` holds the master key.
      - ${APP_HOME_EVENTS_INGEST_TOKEN_FILE:?set APP_HOME_EVENTS_INGEST_TOKEN_FILE in .env to the host path of the home-events ingest token file}:/run/app-keys/home_events_ingest_token:ro
      # Read-only single-file mount of the server database role's password file named in .env (APP_SERVER_DB_PASSWORD_FILE).
      - ${APP_SERVER_DB_PASSWORD_FILE:?set APP_SERVER_DB_PASSWORD_FILE in .env to the host path of the server database password file}:/run/app-keys/server_db_password:ro
      # Read-only single-file mount of the server's bearer token for the ui secrets endpoint (APP_SERVER_SECRETS_TOKEN_FILE).
      - ${APP_SERVER_SECRETS_TOKEN_FILE:?set APP_SERVER_SECRETS_TOKEN_FILE in .env to the host path of the server secrets token file}:/run/app-keys/server_secrets_token:ro
    ports:
      - "127.0.0.1:${SERVER_PORT:-8081}:8081"   # loopback only on the host
    networks:
      - default
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  llm-client:            # LLM client service; no host ports, reachable only on the llm network
    build: {context: ., dockerfile: docker/llm-client/Dockerfile}
    environment:
      SECRETS_API_URL: http://ui:8080
      LLM_CHAT_TOKEN_FILE: /run/service-tokens/llm_chat_token
      LLM_CLIENT_TOKEN_FILE: /run/service-tokens/llm_client_token
    volumes:
      # Read-only single-file mounts of the two service tokens named in .env.
      - ${APP_LLM_CHAT_TOKEN_FILE:?set APP_LLM_CHAT_TOKEN_FILE in .env to the host path of the LLM chat token file}:/run/service-tokens/llm_chat_token:ro
      - ${APP_LLM_CLIENT_TOKEN_FILE:?set APP_LLM_CLIENT_TOKEN_FILE in .env to the host path of the llm-client service token file}:/run/service-tokens/llm_client_token:ro
    networks:
      - llm
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  scanner-mongo:         # this project's MongoDB, data kept in ./data/mongo
    image: mongo:7
    container_name: market-scanner-mongo
    # --auth: connections need the login from .env (SCANNER_MONGO_USER / SCANNER_MONGO_PASSWORD).
    command: ["--auth", "--wiredTigerCacheSizeGB", "0.5", "--bind_ip_all"]
    volumes:
      - ./data/mongo:/data/db            # bind mount: the database files stay in this project folder
    ports:
      - "127.0.0.1:${SCANNER_MONGO_PORT:-27018}:27017"   # 27017 belongs to the tokenfrugal Mongo on this machine
    restart: unless-stopped

  # This project's Postgres and Neo4j, data kept in ./data. Logins come from .env.
  scanner-postgres:
    image: pgvector/pgvector:pg16
    container_name: market-scanner-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?set POSTGRES_ADMIN_USER in .env (the role that owns ./data/postgres)}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_DB: postgres
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${SCANNER_POSTGRES_PORT:-5433}:5432"   # host port 5433, so a Postgres on host port 5432 is not affected
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  scanner-neo4j:
    image: neo4j:5-community
    container_name: market-scanner-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:?set NEO4J_AUTH (user/password) in .env}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
    ports:
      - "127.0.0.1:${SCANNER_NEO4J_HTTP_PORT:-7475}:7474"
      - "127.0.0.1:${SCANNER_NEO4J_BOLT_PORT:-7688}:7687"   # host port 7688, so a Neo4j on host port 7687 is not affected
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  laya:                  # decision-model service; profile `laya` (start.ps1 -WithLaya). Not wired into ranking.
    build: {context: ., dockerfile: docker/laya/Dockerfile}
    container_name: ath-laya
    # No env_file: Laya needs none of the broker/data credentials. To require a
    # bearer key, set LAYA_API_KEY in the shell that runs start.ps1.
    environment:
      - LAYA_API_KEY
    volumes:
      - huggingface_cache:/home/appuser/.cache/huggingface   # weights download once
    ports:
      - "127.0.0.1:8000:8000"            # loopback only: laya-serve has no auth by default
    profiles: ["laya"]
    restart: "no"

volumes:
  huggingface_cache:

networks:
  llm: {}
  default:
    name: market-scanner                 # this project's own network; no external network is needed
