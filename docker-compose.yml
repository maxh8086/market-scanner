# One image per component, all in this one compose file. Everything except `laya`,
# `vllm` and `neo4j` is a one-shot job:
#   docker compose run --rm scanner --symbols INFY,TCS
# start.ps1 drives the whole sequence; stop.ps1 tears it down.
#
# Components hand off through the bind-mounted data/, output/ and logs/ folders
# (SQLite caches, TinyDB store, CSV/XLSX outputs). Container-to-container traffic:
# enrich and conclude -> vllm (OpenAI-style HTTP), graph -> neo4j (bolt).
#
# Secrets reach containers ONLY at runtime, through `env_file` (compose reads the
# file; no image, build arg or log ever contains it). A service gets a file only if
# it needs it: .env (Upstox/Kite) for scanner, enrich and portfolio; .env.neo4j
# (the database password start.ps1 generates) for neo4j and graph.
x-persist: &persist
  - ./data:/app/data
  - ./output:/app/output
  - ./logs:/app/logs

services:
  scanner:
    build: {context: ., dockerfile: docker/scanner/Dockerfile}
    env_file: .env
    volumes: *persist
    restart: "no"

  enrich:
    image: ath-enrich
    build: {context: ., dockerfile: docker/enrich/Dockerfile}
    env_file: .env
    volumes: &persist-config
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
      - ./config:/app/config:ro
    restart: "no"

  enrich-timesfm:        # enrich + TimesFM forecaster (torch, CPU)
    build: {context: ., dockerfile: docker/timesfm/Dockerfile}
    # No env_file: the report/forecast stage reads only data/ and output/.
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
      - huggingface_cache:/home/appuser/.cache/huggingface   # TimesFM weights download once
      - ./config:/app/config:ro
    restart: "no"

  crosscheck:            # independent of Upstox by design: no credentials
    build: {context: ., dockerfile: docker/crosscheck/Dockerfile}
    volumes: *persist
    restart: "no"

  portfolio:             # read-only Kite holdings overlay
    build: {context: ., dockerfile: docker/portfolio/Dockerfile}
    env_file: .env
    volumes: *persist
    restart: "no"

  vllm:                  # Qwen3-4B-Instruct-2507 (MXFP4, FP8 KV) on the GPU: filing extraction and conclusions
    build:
      context: .
      dockerfile: docker/vllm/Dockerfile
      args:
        VLLM_IMAGE: ${VLLM_IMAGE:-vllm/vllm-openai:v0.30.0}   # set to reuse a vllm image you already have
    container_name: ath-vllm
    # No env_file: public model, no credentials. Retune with the ENV knobs in the Dockerfile.
    volumes:
      - huggingface_vllm:/root/.cache/huggingface            # ~7.7 GB of weights, downloaded once
    ports:
      - "127.0.0.1:8001:8000"            # loopback only; conclude reaches it as http://vllm:8000
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - {driver: nvidia, count: 1, capabilities: [gpu]}
    restart: "no"

  neo4j:                 # graph of filings/extractions/conclusions; data purged by graph_sync.py purge
    image: neo4j:5-community
    container_name: ath-neo4j
    env_file:                            # NEO4J_AUTH=neo4j/<generated password>; written by start.ps1
      - {path: .env.neo4j, required: false}   # optional only so `down` works without it
    environment:
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1g
      - NEO4J_server_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/data
    ports:
      - "127.0.0.1:7474:7474"            # browser UI, loopback only
      - "127.0.0.1:7687:7687"            # bolt, loopback only
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: "no"

  graph:                 # loads the document store into neo4j, reads graph facts, purges expired data
    image: ath-enrich
    build: {context: ., dockerfile: docker/enrich/Dockerfile}
    entrypoint: ["python", "graph_sync.py"]
    env_file:
      - {path: .env.neo4j, required: false}
    environment:
      - NEO4J_URI=bolt://neo4j:7687
    volumes: *persist-config
    depends_on:
      neo4j: {condition: service_healthy}
    restart: "no"

  report:                # final workbook: every stock in sheet 1, summary in sheet 2
    image: ath-enrich
    build: {context: ., dockerfile: docker/enrich/Dockerfile}
    entrypoint: ["python", "final_report.py"]
    volumes: *persist
    restart: "no"

  conclude:              # per-stock conclusions from the stored insights; same image as enrich
    image: ath-enrich
    build: {context: ., dockerfile: docker/enrich/Dockerfile}
    entrypoint: ["python", "conclude.py"]
    environment:
      - CONCLUDE_URL=http://vllm:8000     # so `run --rm conclude --limit 5` still finds the server
    # No env_file: reads data/ and output/, talks only to the vllm service.
    volumes: *persist
    restart: "no"

  laya:                  # decision-model service; profile `laya` (start.ps1 -WithLaya). Not wired into ranking.
    build: {context: ., dockerfile: docker/laya/Dockerfile}
    container_name: ath-laya
    # No env_file: Laya needs none of the broker/data credentials. To require a
    # bearer key, set LAYA_API_KEY in the shell that runs start.ps1.
    environment:
      - LAYA_API_KEY
    volumes:
      - huggingface_cache:/home/appuser/.cache/huggingface   # weights download once
    ports:
      - "127.0.0.1:8000:8000"            # loopback only: laya-serve has no auth by default
    profiles: ["laya"]
    restart: "no"

volumes:
  huggingface_cache:
  huggingface_vllm:
  neo4j_data:
